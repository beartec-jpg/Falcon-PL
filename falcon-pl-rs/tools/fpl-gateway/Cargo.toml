[package]
name = "fpl-gateway"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-All-Rights-Reserved"
description = "Falcon Cloud RPC gateway: keyed, metered, allowlisted HTTP front for a Falcon PL node (testnet)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fpl-gatewayd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
