# Falcon DAG public-testnet profile — network_id **9003**
# Ports offset from local regtest (9002 uses 1800x/1900x).
#
#   cd falcon-dag-rs
#   ./scripts/start-testnet-9003.sh
#   # or:
#   docker compose -f deploy/testnet-9003/docker-compose.yml up --build
#
x-node: &node
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  environment:
    RUST_LOG: info
  restart: unless-stopped
  networks: [fd9003]

services:
  val1:
    <<: *node
    command:
      - --id=val1
      - --rpc=0.0.0.0:28001
      - --p2p=0.0.0.0:29001
      - --peers=val2:29002,val3:29003,val4:29004,val5:29005
      - --unl=val1,val2,val3,val4,val5
      - --worker-index=0
      - --worker-count=5
      - --network-id=9003
      - --crypto=hmac-sha256-dev
      - --require-tx-sigs
      - --auto-sign
      - --data-dir=/data
      - --snapshot-interval=15
      - --batch-interval=0.2
    ports:
      - "28001:28001"
      - "29001:29001"
    volumes: [val1-data:/data]

  val2:
    <<: *node
    command:
      - --id=val2
      - --rpc=0.0.0.0:28002
      - --p2p=0.0.0.0:29002
      - --peers=val1:29001,val3:29003,val4:29004,val5:29005
      - --unl=val1,val2,val3,val4,val5
      - --worker-index=1
      - --worker-count=5
      - --network-id=9003
      - --crypto=hmac-sha256-dev
      - --require-tx-sigs
      - --auto-sign
      - --data-dir=/data
      - --snapshot-interval=15
      - --batch-interval=0.2
    ports:
      - "28002:28002"
      - "29002:29002"
    volumes: [val2-data:/data]

  val3:
    <<: *node
    command:
      - --id=val3
      - --rpc=0.0.0.0:28003
      - --p2p=0.0.0.0:29003
      - --peers=val1:29001,val2:29002,val4:29004,val5:29005
      - --unl=val1,val2,val3,val4,val5
      - --worker-index=2
      - --worker-count=5
      - --network-id=9003
      - --crypto=hmac-sha256-dev
      - --require-tx-sigs
      - --auto-sign
      - --data-dir=/data
      - --snapshot-interval=15
      - --batch-interval=0.2
    ports:
      - "28003:28003"
      - "29003:29003"
    volumes: [val3-data:/data]

  val4:
    <<: *node
    command:
      - --id=val4
      - --rpc=0.0.0.0:28004
      - --p2p=0.0.0.0:29004
      - --peers=val1:29001,val2:29002,val3:29003,val5:29005
      - --unl=val1,val2,val3,val4,val5
      - --worker-index=3
      - --worker-count=5
      - --network-id=9003
      - --crypto=hmac-sha256-dev
      - --require-tx-sigs
      - --auto-sign
      - --data-dir=/data
      - --snapshot-interval=15
      - --batch-interval=0.2
    ports:
      - "28004:28004"
      - "29004:29004"
    volumes: [val4-data:/data]

  val5:
    <<: *node
    command:
      - --id=val5
      - --rpc=0.0.0.0:28005
      - --p2p=0.0.0.0:29005
      - --peers=val1:29001,val2:29002,val3:29003,val4:29004
      - --unl=val1,val2,val3,val4,val5
      - --worker-index=4
      - --worker-count=5
      - --network-id=9003
      - --crypto=hmac-sha256-dev
      - --require-tx-sigs
      - --auto-sign
      - --data-dir=/data
      - --snapshot-interval=15
      - --batch-interval=0.2
    ports:
      - "28005:28005"
      - "29005:29005"
    volumes: [val5-data:/data]

networks:
  fd9003:
    driver: bridge

volumes:
  val1-data:
  val2-data:
  val3-data:
  val4-data:
  val5-data:
