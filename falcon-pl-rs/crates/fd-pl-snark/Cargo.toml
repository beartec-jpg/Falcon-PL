[package]
name = "fd-pl-snark"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Groth16 FPL light-client: BabyJubJub LC (live) and Falcon-512 QC (next)"

[[bin]]
name = "falcon-pl-snark"
path = "src/bin/falcon_pl_snark.rs"

[dependencies]
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ed-on-bn254 = { version = "0.4", features = ["r1cs"] }
ark-ff = "0.4"
ark-groth16 = { version = "0.4", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "0.4", default-features = false, features = ["std"] }
ark-relations = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", features = ["derive"] }
ark-snark = "0.4"
ark-std = { version = "0.4", features = ["std"] }
ark-poly = "0.4"
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = "0.10"
pqcrypto-falcon = "0.3"
pqcrypto-traits = "0.3"

[dev-dependencies]
ark-groth16 = { version = "0.4", default-features = false, features = ["std"] }
